# Checks run before every commit (install once with: .venv/bin/pre-commit install).
# The same checks run on GitHub on every push (.github/workflows/ci.yml).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: \.json$ # generated data files
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.5.0
    hooks:
      - id: flake8

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: python
        additional_dependencies: ["pytest==9.2.0"]
        pass_filenames: false
        types: [python]
