# Code checks on every push and pull request: the same pre-commit hooks as locally (black, flake8, pytest…).
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: pip install -r requirements-dev.txt
      - run: pre-commit run --all-files --show-diff-on-failure
