# Publishes the site on GitHub Pages: on every push to main, by hand, or called by the daily update (daily.yml).
# The page (map/site/index.html) comes from git; its data files come from the `data` release (see data.py).
# make_netlify.py turns map/site into a static folder with a full HTML document. Build and deploy are separate
# jobs (GitHub's recommended layout): the deploy job only starts once the uploaded artifact is registered.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                 # when called right after the daily update, include its commit
      - name: Get the site data (data release)
        run: python3 data.py pull --site
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: python3 map/make_netlify.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: map/netlify

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
