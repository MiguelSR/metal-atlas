<title>Metal Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen map colored by each country's leading genre; filters in the header; floating card next to the clicked area (bottom sheet on phones). Single dark theme by choice. */
:root {
  --ground: #0e1013;
  --land: #1c2027;
  --edge: #0e1013;
  --ink: #e6e2d8;
  --muted: #8d939c;
  --rule: #2b3039;
  --card: #15181d;
  --gold: #d6ad57;
  /* fixed genre colors (validated against each other, including color-vision deficiency) */
  --g-black: #6aa6f0;
  --g-death: #b8352a;
  --g-thrash: #139a74;
  --g-heavy: #f0cf6a;
  --g-other: #3f4550;
  --display: "Pirata One", "UnifrakturMaguntia", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }  /* the [hidden] attribute must win over display rules (also outside claude.ai) */
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 14px; overflow: hidden; }
.app { position: relative; height: 100%; display: flex; flex-direction: column; }
header {
  display: flex; flex-wrap: wrap; align-items: end; gap: 10px 24px; justify-content: space-between;
  padding-block: 14px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
}
h1 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; margin: 0; letter-spacing: .5px; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
.tools input {
  background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px;
  font: inherit; padding: 7px 10px;
}
#q { width: 170px; max-width: 100%; }
#bq { width: 200px; max-width: 100%; }
.years { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.years input { width: 76px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.years button, .chipbtn {
  background: none; border: 1px solid var(--rule); color: var(--muted); border-radius: 4px; font: inherit; font-size: 12px;
  padding: 6px 9px; cursor: pointer;
}
.years button:hover, .chipbtn:hover { color: var(--ink); border-color: var(--muted); }
.presets { display: flex; gap: 4px; flex-wrap: wrap; }
.presets button { padding: 3px 7px; font-family: var(--mono); font-size: 11px; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.stage { position: relative; flex: 1; min-height: 0; }
svg#map { width: 100%; height: 100%; display: block; cursor: grab; }
svg#map:active { cursor: grabbing; }
.country { stroke: var(--edge); stroke-width: .4; vector-effect: non-scaling-stroke; transition: fill .2s, opacity .2s; }
.country.has { cursor: pointer; }
.country.has:hover { stroke: var(--ink); stroke-width: 1; }
.country.sel { stroke: var(--gold); stroke-width: 1.6; }
.country.dim { opacity: .18; }
.country.under { pointer-events: none; }
.region { stroke: none; transition: fill .2s, opacity .2s; }
.region.has { cursor: pointer; }
.region.has:hover { filter: brightness(1.3); }
.region.sel { stroke: var(--gold); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.region.dim { opacity: .18; }
.rborder { fill: none; stroke: var(--edge); stroke-width: .6; vector-effect: non-scaling-stroke; pointer-events: none; }
.cmesh { fill: none; stroke: var(--ink); stroke-opacity: .5; stroke-width: .9; vector-effect: non-scaling-stroke; pointer-events: none; }
.sphere { fill: var(--ground); }
.grat { fill: none; stroke: var(--rule); stroke-width: .5; vector-effect: non-scaling-stroke; }
.tip {
  position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--rule);
  padding: 6px 9px; border-radius: 4px; font-size: 12px; white-space: nowrap; transform: translate(12px, 12px);
  display: grid; gap: 2px; z-index: 3;
}
.tip b { font-weight: 600; } .tip .m { font-family: var(--mono); color: var(--muted); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend {
  position: absolute; left: max(16px, calc(env(safe-area-inset-left, 0px) + 12px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: color-mix(in srgb, var(--card) 88%, transparent); border: 1px solid var(--rule); border-radius: 6px;
  padding: 8px 10px; display: grid; gap: 2px; font-size: 12px;
}
.legend .t { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.legend button { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 0 4px; background: none; border: 0; color: var(--ink);
  font: inherit; padding: 3px 4px; border-radius: 3px; cursor: pointer; text-align: left; }
.legend button:hover, .legend button.on { background: var(--land); }
.legend button.off { opacity: .4; }
.legend .n { font-family: var(--mono); color: var(--muted); font-size: 11px; padding-left: 12px; font-variant-numeric: tabular-nums; }
.zoom { position: absolute; right: max(16px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; font-size: 16px; cursor: pointer; }
.zoom button:hover { border-color: var(--muted); }
.credits {
  position: absolute; right: max(60px, calc(env(safe-area-inset-right, 0px) + 56px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  max-width: 46%; text-align: right; font-size: 10.5px; line-height: 1.5; color: var(--muted);
  background: color-mix(in srgb, var(--ground) 70%, transparent); padding: 2px 6px; border-radius: 3px;
}
.credits a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--rule); }
.credits a:hover { color: var(--ink); }

/* search results */
.results {
  position: absolute; left: max(16px, calc(env(safe-area-inset-left, 0px) + 12px)); top: 12px;
  width: 340px; max-width: calc(100% - 32px); max-height: 48%; display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 12px 36px rgba(0,0,0,.45); z-index: 1;
}
.results .rh { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 10px 12px 8px; border-bottom: 1px solid var(--rule); }
.results .rh b { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.results .rh .meta { grid-column: 1 / -1; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.results ol { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; min-height: 0; }
.results li { padding: 6px 12px; display: grid; gap: 1px; }
.results li + li { border-top: 1px solid var(--rule); }
.results li a { color: var(--ink); font-weight: 600; text-decoration: none; }
.results li a:hover { color: var(--gold); text-decoration: underline; }
.results mark { background: none; color: var(--gold); }
.results .ln { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.results .cbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule); }
.results .cbtn:hover { color: var(--gold); }
.results .more { color: var(--muted); font-size: 11.5px; padding: 8px 12px; }

/* card */
.pop {
  position: absolute; width: 370px; max-width: calc(100% - 32px); max-height: calc(100% - 32px);
  display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
  box-shadow: 0 18px 50px rgba(0,0,0,.55); z-index: 2;
}
.pop-h { padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.pop-h h2 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.05; margin: 0; text-wrap: balance; min-width: 0; }
.pop-h .meta { grid-column: 1 / -1; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.pop-h .meta a.ma { color: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 2px; }
.pop-h .meta a.ma:hover { color: var(--gold); text-decoration-color: currentColor; }
.close, .back { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 2px 4px; }
.close { font-size: 20px; line-height: 1; align-self: start; }
.close:hover, .back:hover { color: var(--ink); }
.back { font-size: 12px; padding: 0; margin-bottom: 4px; text-align: left; grid-column: 1 / -1; justify-self: start; }
.gs { padding: 10px 16px 0; }
.gs input { width: 100%; box-sizing: border-box; background: var(--ground); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; font: inherit; padding: 7px 10px; }
.g mark { background: none; color: var(--gold); }
.pop-b { overflow-y: auto; padding: 8px 8px 12px; min-height: 0; }
.eyebrow { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 6px 8px 4px; }
.empty { color: var(--muted); padding: 16px 8px; }
.pager { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 8px 2px; color: var(--muted); font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.pager button { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 1px solid var(--rule); border-radius: 50%; background: none; color: var(--ink); font: inherit; font-size: 15px; line-height: 1; cursor: pointer; }
.pager button:hover { color: var(--gold); border-color: var(--gold); }
.pager button:disabled { opacity: .3; cursor: default; color: var(--ink); border-color: var(--rule); }
.g { display: grid; grid-template-columns: 18px 1fr auto; gap: 3px 8px; align-items: center; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 7px 8px; border-radius: 4px; cursor: pointer; }
.g:hover { background: var(--land); }
.g .rk { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.g .nm { font-weight: 500; min-width: 0; }
.g .ct { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.g .track { grid-column: 2 / -1; height: 5px; background: var(--land); border-radius: 2px; overflow: hidden; }
.g .fill { display: block; height: 100%; border-radius: 2px; }
.g .go { color: var(--gold); opacity: 0; transition: opacity .15s; margin-left: 4px; }
.g:hover .go { opacity: 1; }
.b { display: grid; grid-template-columns: 18px 1fr; gap: 0 8px; padding: 8px; border-bottom: 1px solid var(--rule); }
.b:last-child { border-bottom: 0; }
.b .rk { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 3px; }
.b a { color: var(--ink); font-weight: 600; text-decoration: none; font-size: 14.5px; }
.b a:hover { color: var(--gold); text-decoration: underline; }
.nmr { display: flex; align-items: center; gap: 6px; min-width: 0; }
.nmr > a:first-child { min-width: 0; overflow-wrap: anywhere; }
.pl { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%;
  background: none; color: var(--muted); cursor: pointer; }
.pl:hover { color: var(--gold); background: var(--land); }
.pl svg { width: 14px; height: 14px; fill: currentColor; }
.pl.on { color: var(--gold); }
.pl.busy svg { animation: plspin 1s linear infinite; }
.pl.none { opacity: .35; cursor: default; }
.pl.none:hover { background: none; color: var(--muted); }
@keyframes plspin { to { transform: rotate(360deg); } }
.np { position: absolute; right: max(16px, calc(env(safe-area-inset-right, 0px) + 12px)); top: 12px; z-index: 3;
  display: flex; align-items: center; gap: 6px; max-width: min(320px, calc(100% - 32px)); padding: 4px 6px 4px 4px;
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.35); font-size: 12px; }
.np button { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%;
  background: none; color: var(--ink); cursor: pointer; font: inherit; }
.np button:hover { background: var(--land); color: var(--gold); }
.np button:disabled { opacity: .3; cursor: default; background: none; color: var(--ink); }
.np svg { width: 13px; height: 13px; fill: currentColor; }
.np .tx { min-width: 0; display: grid; line-height: 1.25; }
.np .tx b, .np .tx span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .tx b { font-weight: 600; }
.np .tx span { color: var(--muted); font-size: 11px; }
.np .bar { position: absolute; left: 14px; right: 14px; bottom: 1px; height: 2px; border-radius: 1px; overflow: hidden; }
.np .bar i { display: block; height: 100%; width: 0; background: var(--gold); opacity: .7; }
.b .ln { color: var(--muted); font-size: 12px; margin-top: 2px; min-width: 0; overflow-wrap: anywhere; }
.b .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.chip { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--rule); color: var(--muted); }
.chip.on { color: #9fd3a6; border-color: #35533a; }
.chip.off { color: #c99a8f; border-color: #553a35; }
.chip.rv { color: var(--gold); border-color: #5a4a26; }
.foot { padding: 8px 16px 12px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 11px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--mono); font-size: 12px; }
@media (max-width: 640px) {
  h1 { font-size: 28px; }
  .tools, #q, #bq { width: 100%; }
  .presets { display: none; }
  .legend { padding: 6px 8px; font-size: 11px; }
  .results { left: 16px; right: 16px; width: auto; max-height: 40%; }
  .pop { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto; max-width: none; max-height: 72%;
         border-radius: 10px 10px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .zoom { display: none; }
  .credits { right: max(16px, env(safe-area-inset-right, 0px)); font-size: 9.5px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- game mode ---------- */
.titlerow { display: flex; align-items: center; gap: 12px; }
.mode { background: none; border: 1px solid var(--rule); color: var(--muted); border-radius: 999px; font: inherit; font-size: 11.5px;
  padding: 3px 10px; cursor: pointer; letter-spacing: .02em; }
.mode:hover { color: var(--gold); border-color: var(--gold); }
body.game-on .tools, body.game-on .legend, body.game-on .zoom, body.game-on .results, body.game-on .pop,
body.game-on .np, body.game-on .tip, body.game-on .credits { display: none !important; }
.game { position: absolute; inset: 0; z-index: 4; overflow-y: auto; display: grid; place-items: start center;
  background: color-mix(in srgb, var(--ground) 86%, transparent); padding: 24px 16px 40px; }
.gcard { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--rule); border-radius: 8px;
  box-shadow: 0 18px 50px rgba(0,0,0,.5); padding: 20px; display: grid; gap: 14px; }
.gcard h2 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; margin: 0; }
.gtx { color: var(--muted); margin: 0; line-height: 1.5; }
.lvls { display: grid; gap: 6px; }
.mode.lang { padding: 3px 8px; font-family: var(--mono); font-size: 11px; }
.mode.lang b { color: var(--ink); font-weight: 600; }
.sound { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 6px;
  background: color-mix(in srgb, var(--gold) 10%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); }
.sound .spk { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--gold); color: #17130a; }
.sound .spk svg { width: 20px; height: 20px; fill: currentColor; }
.sound div { display: grid; gap: 1px; flex: 1; min-width: 0; } .sound span { color: var(--muted); font-size: 12.5px; }
.sound .gbtn { flex: none; padding: 6px 10px; font-size: 12.5px; }
.gpm { flex: 1; display: grid; gap: 6px; min-width: 0; }
.glab { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.eq i { width: 3px; height: 3px; background: var(--muted); border-radius: 1px; }
.eq.on i { background: var(--gold); animation: eqb .9s ease-in-out infinite; }
.eq.on i:nth-child(2) { animation-delay: -.3s; } .eq.on i:nth-child(3) { animation-delay: -.6s; } .eq.on i:nth-child(4) { animation-delay: -.15s; }
@keyframes eqb { 0%, 100% { height: 3px; } 50% { height: 14px; } }
.gplay .pp.pulse { animation: ppulse 1.6s ease-out infinite; }
@keyframes ppulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 60%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
@media (prefers-reduced-motion: reduce) { .eq.on i, .gplay .pp.pulse, .pl.busy svg { animation: none; } .eq.on i { height: 10px; } }
.lvl { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 10px; text-align: left; background: none; color: var(--ink);
  border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; font: inherit; cursor: pointer; }
.lvl b { font-family: var(--display); font-size: 24px; font-weight: 400; color: var(--muted); text-align: center; }
.lvl span { display: grid; } .lvl small { color: var(--muted); font-size: 12px; }
.lvl:hover { border-color: var(--muted); }
.lvl:disabled { opacity: .35; cursor: not-allowed; }
.lvl.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 8%, transparent); }
.lvl.on b { color: var(--gold); }
.gbtn { background: none; border: 1px solid var(--rule); color: var(--ink); border-radius: 6px; font: inherit; padding: 8px 14px; cursor: pointer; }
.gbtn:hover { border-color: var(--muted); }
.gbtn.primary { background: var(--gold); border-color: var(--gold); color: #17130a; font-weight: 600; }
.gbtn.primary:hover { filter: brightness(1.08); }
.gbtn.ghost { border-color: transparent; color: var(--muted); } .gbtn.ghost:hover { color: var(--ink); }
.ghead { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ghead b { color: var(--ink); font-weight: 500; }
.gplay { display: flex; align-items: center; gap: 12px; }
.gplay .pp { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--gold); color: #17130a; cursor: pointer; display: grid; place-items: center; }
.gplay .pp svg { width: 18px; height: 18px; fill: currentColor; }
.gbar { flex: 1; height: 4px; background: var(--land); border-radius: 2px; overflow: hidden; }
.gbar i { display: block; height: 100%; width: 0; background: var(--gold); }
/* current clue: one at a time, in the spotlight */
.spot { display: grid; gap: 12px; padding: 16px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--gold) 35%, var(--rule));
  background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 9%, var(--card)), var(--card)); }
.spot.enter { animation: spotin .35s ease-out; }
@keyframes spotin { from { opacity: 0; transform: translateY(6px) scale(.985); } }
.spot-k { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--mono); font-size: 11px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.spot-n { color: var(--muted); letter-spacing: .04em; text-transform: none; }
.spot-s { margin: 0; color: var(--muted); line-height: 1.5; }
.spot-v { font-size: 20px; line-height: 1.35; overflow-wrap: anywhere; }
.spot-v small { color: var(--muted); font-size: .75em; }
.spot-v.v0 { font-size: 24px; }                                       /* origin */
.spot-v.v1, .spot-v.v4 { font-family: var(--display); font-size: 40px; line-height: 1.1; }  /* year, album */
.spot-v.v4 i { font-style: normal; }
.spot-v.v2 { font-size: 16.5px; }                                     /* review */
.spot-v.v3 { font-size: 16px; line-height: 1.6; }                     /* lineup */
.spot-v .gph { max-height: 300px; }
.spot-f { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pips { display: inline-flex; gap: 5px; }
.pips i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--muted); }
.pips i.on { background: var(--gold); border-color: var(--gold); }
.gbtn.reveal { border-style: dashed; border-color: color-mix(in srgb, var(--gold) 55%, transparent); color: var(--gold); font-size: 13px; padding: 6px 12px; }
.gbtn.reveal:hover:not(:disabled) { background: color-mix(in srgb, var(--gold) 10%, transparent); }
.gbtn.reveal:disabled { opacity: .45; cursor: default; color: var(--muted); border-color: var(--rule); }
@media (prefers-reduced-motion: reduce) { .spot.enter { animation: none; } }
/* earlier clues: compact list, so nothing is lost */
